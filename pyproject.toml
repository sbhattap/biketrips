[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biketrips"
version = "0.1.0"
description = "Honest evaluation of shared-bike demand models from urban features in Shenzhen"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb==2.0.0",
    "pandas==3.1.0",
    "numpy==2.5.4",
    "pyarrow==26.0.0",
    "geopandas==1.2.0",
    "shapely==2.2.0",
    "pyogrio==0.13.0",
    "pyproj==3.8.0",
    "rasterio==1.5.2",
    "h3==3.7.7",
    "openpyxl==3.1.5",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "xgboost==3.4.1",
    "optuna==5.0.0",
    "torch==2.15.0",
    "torch-geometric==2.8.1",
    "matplotlib==3.11.2",
    "pyyaml==6.0.3",
    "gdown==6.5.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "jupyter==1.1.1", "nbconvert==7.17.2", "ipykernel==7.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
